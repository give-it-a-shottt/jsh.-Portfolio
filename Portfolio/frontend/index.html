<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" sizes="192x192" href="/favicon.webp" />
    <!-- iOS 홈 화면 추가용 — webp 를 쓰지 않고, 투명을 검게 채워서 흰 바탕 PNG 를 둔다 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <!-- 포트폴리오 Design 사례(숙박 앱 로그인) 로고의 'A' 한 글자만 받는다 -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Diplomata&text=A&display=swap"
    />
    <!-- 첫 방문 인트로의 코드 글꼴 — 화면에 치는 print("Hello, jsh. world") 와 '>' 글자만 받는다 -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&text=print(%22Hello%2C%20jsh.%20world%22)%3E&display=swap"
    />
    <!-- 마에스트로: 홈의 작품 번호(Lora 이탤릭), 식당 상세의 추천 인용(Noto Serif KR) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lora:ital@1&family=Noto+Serif+KR&display=swap"
    />
    <title>jsh.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
